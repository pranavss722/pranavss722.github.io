<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Page Not Found · Pranav Saravanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111116'/%3E%3Ctext x='50' y='73' font-family='Arial Black,Arial' font-size='64' font-weight='900' fill='%23FF1E3C' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{--red:#FF1E3C;--amber:#FF6A2B;--violet:#7C5CFF;--black:#08080A;--white:#F5F1EB;--gray:#9EA1AB;--line:#242430;--grad:linear-gradient(100deg,#FF1E3C,#FF6A2B,#FF1E3C);--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
::selection{background:var(--red);color:#fff}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:drift 18s var(--ease) infinite alternate}
.b1{width:44vw;height:44vw;background:var(--red);top:-14%;right:-8%}
.b2{width:36vw;height:36vw;background:var(--violet);bottom:-16%;left:-10%;animation-delay:-6s;opacity:.28}
@keyframes drift{to{transform:translate(6%,8%) scale(1.16)}}
.grid{position:fixed;inset:0;z-index:0;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 10%,transparent 75%)}
.wrap{position:relative;z-index:2;padding:2rem}
.code{font-family:'Bebas Neue',sans-serif;font-size:clamp(7rem,26vw,18rem);line-height:.82;letter-spacing:-.01em;background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.code{-webkit-text-fill-color:currentColor;color:var(--red)}}
@keyframes shine{to{background-position:200% center}}
.sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(1.3rem,3.6vw,2rem);color:#CBCBD3;margin:.4rem 0 .5rem}
.desc{font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;margin-bottom:2.2rem}
.btn{display:inline-flex;align-items:center;gap:.55rem;font-family:'JetBrains Mono',monospace;font-size:.82rem;letter-spacing:.04em;padding:.9rem 1.6rem;border-radius:100px;color:#fff;background:var(--grad);background-size:200% auto;transition:all .35s var(--ease);text-decoration:none;box-shadow:0 8px 30px -8px rgba(255,30,60,.3)}
.btn:hover{background-position:right center;transform:translateY(-3px)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:3px}
</style>
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span></div>
<div class="grid"></div>
<main class="wrap">
  <div class="code">404</div>
  <p class="sub">This route returned nothing.</p>
  <p class="desc">// the page you're looking for doesn't exist</p>
  <a href="/" class="btn">Back to home ↗</a>
</main>
</body>
</html>
